<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Bootstrap & External Libraries -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" />
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.png" type="image/png" />
  <title>Digital Guestbook</title>
</head>
<body>
  <div class="wrapper d-flex flex-column align-items-center">
    
    <!-- Logo -->
    <div class="container mb-2 mt-3">
      <div class="row px-4 justify-content-center" id="hero-container">
        <img src="Logo_GS2026.png" alt="Logo" class="img-fluid" id="hero" />
      </div>
    </div>

    <div class="container d-flex justify-content-center mt-1">
      <div class="p1" id="p1" style="display: block; width: 100%; max-width: 400px;">
        <form id="identity" action="" method="get">
          <div class="pg1" id="pg1" style="display: block">
            
            <!-- Headers -->
            <div class="text-center mb-3">
              <div class="title">DIGITAL GUESTBOOK</div>
              <div class="subtitle">TUANGKAN PESANMU UNTUK GREBEGSURO 2026</div>
            </div>

            <!-- Form: Nama -->
            <div class="input-box-container mb-3">
              <div class="input-header">NAMA :</div>
              <div class="d-flex align-items-center">
                <div class="icon-container">
                  <i class="fa-solid fa-pen"></i>
                </div>
                <div class="form-group w-100">
                  <input type="text" class="form-control" id="name" placeholder="Masukkan nama kamu" maxlength="15">
                </div>
              </div>
            </div>

            <!-- Form: Pesan -->
            <div class="input-box-container mb-3">
              <div class="input-header">PESAN :</div>
              <div class="d-flex align-items-center">
                <div class="icon-container">
                  <i class="fa-solid fa-comment-dots"></i>
                </div>
                <div class="form-group w-100">
                  <textarea class="form-control" name="comment" id="comment" rows="2" maxlength="80" placeholder="Tulis pesan untuk GrebegSuro 2026..."></textarea>
                </div>
              </div>
            </div>

            <!-- Pilih Karakter -->
            <div class="text-center mb-2">
              <div class="tulisan-karakter">PILIH KARAKTER :</div>
            </div>

            <!-- Carousel -->
            <div class="carousel-container mb-3">
              <div class="carousel-wrapper">
                <i id="left" class="fa-solid fa-arrow-left"></i>
                <ul class="carousel">
                  <li class="card" data-char="1"><div class="img"><img src="char/1.png" alt="char1" draggable="false" /></div></li>
                  <li class="card" data-char="2"><div class="img"><img src="char/2.png" alt="char2" draggable="false" /></div></li>
                  <li class="card" data-char="3"><div class="img"><img src="char/3.png" alt="char3" draggable="false" /></div></li>
                  <li class="card" data-char="4"><div class="img"><img src="char/4.png" alt="char4" draggable="false" /></div></li>
                  <li class="card" data-char="5"><div class="img"><img src="char/5.png" alt="char5" draggable="false" /></div></li>
                  <li class="card" data-char="6"><div class="img"><img src="char/6.png" alt="char6" draggable="false" /></div></li>
                  <li class="card" data-char="7"><div class="img"><img src="char/7.png" alt="char7" draggable="false" /></div></li>
                  <li class="card" data-char="8"><div class="img"><img src="char/8.png" alt="char8" draggable="false" /></div></li>
                  <li class="card" data-char="9"><div class="img"><img src="char/9.png" alt="char9" draggable="false" /></div></li>
                  <li class="card" data-char="10"><div class="img"><img src="char/10.png" alt="char10" draggable="false" /></div></li>
                </ul>
                <i id="right" class="fa-solid fa-arrow-right"></i>
              </div>
            </div>

            <!-- Submit Button -->
            <div class="button d-flex justify-content-center mt-2 mb-2">
              <button id="next" class="submit-btn" type="button">KIRIM PESAN</button>
            </div>
            
          </div>
        </form>
      </div>

      <!-- Page 2: Thank You -->
      <div class="p2" id="p2" style="display:none;">
        <div id="char-container"></div>
        <div class="thank-glow-box mt-3">
          <div class="thank-inner">
            <div class="big">Terimakasih</div>
            <button type="button" class="btn btn-outline-light mt-2 mb-2">
              <div id="user-name" class="username"></div>
            </button>
            <div class="big">Selamat Datang Di Gregebsuro Ponorogo 2026!</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="script.js" defer></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const textarea = document.getElementById("comment");
      textarea.addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = this.scrollHeight + "px";
        adjustScale(); // Recalculate scale when height of text area changes
      });

      // --- AUTO SCALE SCRIPT ---
      // Fungsi ini akan menskala (zoom) seluruh UI agar pas di semua ukuran layar 
      // (terutama layar vertikal raksasa seperti 2160x3840).
      function adjustScale() {
        const wrapper = document.querySelector('.wrapper');
        const targetWidth = 450; 
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        // Reset to default/static properties to accurately measure the natural unscaled height
        wrapper.style.transform = 'none';
        wrapper.style.position = 'static';
        wrapper.style.width = `${targetWidth}px`;
        wrapper.style.margin = '0 auto';

        // Measure actual content height
        const targetHeight = wrapper.offsetHeight || 850;

        // Hitung skala berdasarkan lebar layar vs lebar target
        let scale = screenWidth / targetWidth;

        // Jika tinggi ter-skala melebihi tinggi layar, sesuaikan skala agar pas dengan tinggi layar
        if (scale * targetHeight > screenHeight) {
          scale = screenHeight / targetHeight; 
        }

        // Terapkan efek scale dengan teknik absolute centering agar selalu presisi di tengah
        wrapper.style.width = `${targetWidth}px`;
        wrapper.style.position = 'absolute';
        wrapper.style.left = '50%';
        wrapper.style.transformOrigin = 'top center';
        wrapper.style.transform = `translateX(-50%) scale(${scale})`;
        
        // Pusatkan secara vertikal jika layar lebih tinggi daripada konten ter-skala
        const scaledHeight = scale * targetHeight;
        if (screenHeight > scaledHeight) {
          const topOffset = (screenHeight - scaledHeight) / 2;
          wrapper.style.top = `${topOffset}px`;
        } else {
          wrapper.style.top = '0px';
        }
        
        // Memaksa body untuk memotong sisa ruang agar background fixed tidak error (overflow)
        document.body.style.overflowX = 'hidden';
      }

      window.addEventListener('resize', adjustScale);
      adjustScale(); // Panggil pertama kali saat halaman dimuat
    });
  </script>
</body>
</html>
